<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus pedidos | HPR Print 3D</title>
  <meta name="description" content="Acompanhe o andamento dos seus pedidos na HPR Print 3D.">
  <meta name="theme-color" content="#110628">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/conta.css">
</head>
<body>
  <header class="topo">
    <div class="envoltorio">
      <a class="marca" href="./">
        <img class="marca-carretel" data-logo-fixo src="img/logo-192.png" alt="" width="34" height="34">
        HPR Print 3D
      </a>
      <nav aria-label="Principal">
        <a class="discreto" href="./#pecas">Peças</a>
        <a class="botao botao-principal botao-pequeno" href="./#pedido">Fazer pedido</a>
      </nav>
    </div>
  </header>

  <main class="envoltorio conta">
    <div id="aviso" class="aviso" role="status" hidden></div>

    <!-- Entrar / criar conta -->
    <section id="tela-entrar" class="cartao-conta" hidden>
      <h1>Acompanhe seus pedidos</h1>
      <p class="apoio">Entre para ver em que etapa está cada pedido. Pedidos feitos com o mesmo e-mail aparecem aqui.</p>

      <button class="botao botao-google" type="button" id="entrar-google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.6 2.2 2.2 6.6 2.2 12s4.4 9.8 9.8 9.8c5.7 0 9.4-4 9.4-9.6 0-.6-.1-1.1-.2-1.6H12z"/></svg>
        Continuar com Google
      </button>

      <div class="ou"><span>ou com e-mail</span></div>

      <div class="alternar" role="tablist" aria-label="Entrar ou criar conta">
        <button type="button" role="tab" id="aba-entrar" aria-selected="true">Entrar</button>
        <button type="button" role="tab" id="aba-criar" aria-selected="false">Criar conta</button>
      </div>

      <form id="form-entrar" class="campos-conta">
        <label class="campo-conta" id="campo-nome" hidden>Seu nome<input id="c-nome" autocomplete="name"></label>
        <label class="campo-conta">E-mail<input id="c-email" type="email" autocomplete="email" required></label>
        <label class="campo-conta">Senha<input id="c-senha" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="botao botao-principal" type="submit" id="c-enviar">Entrar</button>
        <button class="botao-link" type="button" id="esqueci">Esqueci minha senha</button>
      </form>
    </section>

    <!-- Nova senha (link de recuperação) -->
    <section id="tela-senha" class="cartao-conta" hidden>
      <h1>Criar nova senha</h1>
      <form id="form-senha" class="campos-conta">
        <label class="campo-conta">Nova senha<input id="nova-senha" type="password" autocomplete="new-password" minlength="6" required></label>
        <button class="botao botao-principal" type="submit">Salvar nova senha</button>
      </form>
    </section>

    <!-- Pedidos -->
    <section id="tela-pedidos" hidden>
      <div class="conta-cabeca">
        <div>
          <h1 id="ola">Seus pedidos</h1>
          <p class="apoio" id="conta-email"></p>
        </div>
        <div class="conta-acoes">
          <a class="botao botao-contorno botao-pequeno" href="admin.html" id="ir-oficina" hidden>Ir para a oficina</a>
          <button class="botao botao-contorno botao-pequeno" type="button" id="sair">Sair</button>
        </div>
      </div>
      <div id="lista" class="lista-conta" aria-live="polite"></div>
    </section>
  </main>

  <footer class="rodape">
    <div class="envoltorio">
      <span>HPR Print 3D, impressão 3D por encomenda</span>
      <a href="https://www.instagram.com/hprprint3d/" target="_blank" rel="noopener">@hprprint3d</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/conta.js"></script>
</body>
</html>
