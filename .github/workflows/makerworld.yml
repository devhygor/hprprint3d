name: Buscar modelo do MakerWorld

on:
  workflow_dispatch:
    inputs:
      url:
        description: Link do modelo no MakerWorld
        required: true
      id:
        description: Identificador da peça
        required: true

permissions:
  contents: write

concurrency:
  group: makerworld
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados
        env:
          MW_URL: ${{ inputs.url }}
          MW_ID: ${{ inputs.id }}
        run: python scripts/makerworld.py "$MW_URL" "$MW_ID"

      - name: Salvar no repositório
        env:
          MW_ID: ${{ inputs.id }}
        run: |
          git config user.name "hpr-oficina"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/makerworld img/mw
          git diff --cached --quiet && exit 0
          git commit -m "MakerWorld: $MW_ID"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
