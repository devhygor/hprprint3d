name: Manter banco de pedidos ativo

# O Supabase gratuito pausa o projeto depois de 7 dias sem uso.
# Este "toque" a cada 3 dias mantém o banco acordado. Não lê nem grava nenhum pedido.
on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tocar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assets/supabase-config.js
          sparse-checkout-cone-mode: false

      - name: Consultar o banco
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' assets/supabase-config.js | head -1)
          CHAVE=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' assets/supabase-config.js | head -1)
          echo "Endereço: $URL"
          getent hosts "$(echo "$URL" | sed 's#https://##')" || echo "AVISO: o endereço não existe no DNS (projeto pausado ou apagado?)"
          codigo=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 "$URL/rest/v1/ajustes?select=chave&limit=1" -H "apikey: $CHAVE" || true)
          echo "Supabase respondeu $codigo"
          head -c 300 /tmp/resp.txt; echo
          # 000 = não conectou (pausado/sem DNS); 5xx = fora do ar. Os dois devem falhar para avisar por e-mail.
          if [ "$codigo" = "000" ] || [ "$codigo" -ge 500 ]; then
            echo "::error::O Supabase não respondeu ($codigo). Abra supabase.com/dashboard e restaure o projeto."
            exit 1
          fi
